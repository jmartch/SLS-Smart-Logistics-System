services:
  backend:
    build: ./backend
    container_name: sls-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.docker
    environment:
      MESSAGING_TENANT_IDS: "10000000-0000-4000-8000-000000000001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  worker:
    build: ./backend
    container_name: sls-worker
    command: npm run start:worker:dev
    env_file:
      - ./backend/.env.docker
    environment:
      MESSAGING_TENANT_IDS: "10000000-0000-4000-8000-000000000001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: sls-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_USE_MOCK_DATA: "false"
    volumes:
      - ./frontend:/app
      - /app/node_modules
  postgres:
    image: postgis/postgis:17-3.6-alpine
    container_name: sls-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sls
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    build:
      context: ./infra/rabbitmq
    image: sls-rabbitmq:4-management
    container_name: sls-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sls
      RABBITMQ_DEFAULT_PASS: sls
      RABBITMQ_DEFAULT_VHOST: sls
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
  qr-helper:
    profiles: [ "tools" ]
    build: ./qr-helper
    container_name: sls-qrhelper
    command: npm run dev
    volumes:
      - ./qr-helper:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3002:3000"
    environment:
      - WATCHPACK_POLLING=true
volumes:
  postgres_data:
  rabbitmq_data:
