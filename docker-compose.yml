services:
  backend:
    build: ./backend
    container_name: sls-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: sls-frontend
    ports:
      - "5173:5173"
    environment:
      # Los endpoints de catálogos y registro aún no existen en el backend.
      # Mantiene funcional el prototipo hasta completar ZONE-01 y PKG-01.
      VITE_USE_MOCK_DATA: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
  postgres:
    image: postgis/postgis:17-3.6-alpine
    container_name: sls-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sls
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sls-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sls
      RABBITMQ_DEFAULT_PASS: sls
      RABBITMQ_DEFAULT_VHOST: sls
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  qr-helper:
    profiles: ["tools"]
    build: ./qr-helper
    container_name: sls-qrhelper
    command: npm run dev
    volumes:
      - ./qr-helper:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3002:3000"
    environment:
      - WATCHPACK_POLLING=true
volumes:
  postgres_data:
  rabbitmq_data:
