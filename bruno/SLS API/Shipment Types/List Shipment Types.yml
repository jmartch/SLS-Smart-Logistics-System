info:
  name: List Shipment Types
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/shipment-types"
  auth: inherit
  headers:
    - name: x-tenant-id
      value: "{{tenantId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
