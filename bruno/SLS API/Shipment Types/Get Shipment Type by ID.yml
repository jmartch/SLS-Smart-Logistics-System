info:
  name: Get Shipment Type by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/shipment-types/{{shipmentTypeId}}"
  auth: inherit
  headers:
    - name: x-tenant-id
      value: "{{tenantId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
