info:
  name: Get Route by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/routes/{{routeId}}"
  auth: inherit
  headers:
    - name: x-tenant-id
      value: "{{tenantId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
