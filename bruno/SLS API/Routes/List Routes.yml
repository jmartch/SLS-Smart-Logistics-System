info:
  name: List Routes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/routes?state=PLANNED&limit=20&offset=0"
  auth: inherit
  headers:
    - name: x-tenant-id
      value: "{{tenantId}}"
  params:
    - name: state
      value: PLANNED
      enabled: false
    - name: limit
      value: "20"
      enabled: true
    - name: offset
      value: "0"
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
