info:
  name: Cancel Route
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/routes/{{routeId}}/cancel"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tenant-id
      value: "{{tenantId}}"
  body:
    type: json
    data: |-
      {
        "reasonCode": "WEATHER_EMERGENCY",
        "reason": "Lluvias torrenciales impiden la salida del vehículo"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
