info:
  name: Get Route Summary
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/routes/{{routeId}}/summary"
  auth: inherit
  headers:
    - name: x-tenant-id
      value: "{{tenantId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
