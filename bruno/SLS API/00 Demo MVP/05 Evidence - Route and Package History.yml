info:
  name: 05 Evidence - Route and Package History
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/routes/{{routeId}}"
  auth: inherit
  headers:
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: x-user-id
      value: "{{userId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
