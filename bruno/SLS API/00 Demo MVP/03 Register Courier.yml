info:
  name: 03 Register Courier
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/couriers"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": "{{candidateCourierUserId}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
